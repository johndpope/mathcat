[project]
name = "mathcat"
version = "0.1.0"
description = "Local service that renders math formulas to PNG for iTerm2, WezTerm, Kitty, and Ubuntu."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "John Pope" }]
keywords = ["math", "latex", "iterm2", "imgcat", "terminal"]
dependencies = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/johndpope/mathcat"

[project.scripts]
mathcat = "mathcat.cli:main"
mathd = "mathcat.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
